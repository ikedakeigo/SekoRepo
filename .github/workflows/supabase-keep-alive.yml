name: Supabase Keep Alive

# Supabase 無料プランは「7日間アクセスなし」でプロジェクトが自動一時停止される。
# 毎日 keep_alive() RPC を1回叩くことで、その判定をリセットする。
on:
  schedule:
    # 毎日 00:23 UTC = 09:23 JST
    # （毎時0分はランナーが混雑して遅延しやすいため、あえてずらしている）
    - cron: "23 0 * * *"
  workflow_dispatch: # 手動実行用

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY の Secrets が未設定です"
            exit 1
          fi

          response=$(curl -fsS --retry 3 --retry-delay 15 --retry-all-errors \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Supabase is alive: ${response}"
          echo "### Supabase is alive :white_check_mark:" >> "${GITHUB_STEP_SUMMARY}"
          echo "server time: \`${response}\`" >> "${GITHUB_STEP_SUMMARY}"
